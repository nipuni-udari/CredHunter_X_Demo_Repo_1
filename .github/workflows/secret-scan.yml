name: Secret scan

on: [push, pull_request]

permissions:
  contents: read
  security-events: write

jobs:
  credhunter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: nipuni-udari/CredHunter_X@v1
        with:
          llm-model: openai/gpt-5.6-luna
          llm-api-key: ${{ secrets.LLM_API_KEY }}
